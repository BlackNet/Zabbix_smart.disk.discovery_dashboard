# C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\smart_ext.conf
# NVMe Extended SMART - two UserParameters, nothing else.
#
# No sudo equivalent needed: the Zabbix agent service runs as LocalSystem,
# which already has the privileges smartctl requires for NVMe admin commands.
#
# Install:
#   1. drop this file in the agent's include directory
#   2. Restart-Service "Zabbix Agent 2"
#
# Verify first, from an elevated prompt:
#   & "C:\Program Files\smartmontools\bin\smartctl.exe" --scan -j
#
# Then from the Zabbix server:
#   zabbix_get -s <host> -k smart.ext.scan

UserParameter=smart.ext.scan,"C:\Program Files\smartmontools\bin\smartctl.exe" --scan -j
UserParameter=smart.ext.raw[*],"C:\Program Files\smartmontools\bin\smartctl.exe" -j -a -d $2 $1

# ---------------------------------------------------------------------------
# If smartmontools is installed elsewhere, correct both paths. Common variants:
#   C:\Program Files\smartmontools\bin\smartctl.exe
#   C:\Program Files (x86)\smartmontools\bin\smartctl.exe
#
# Deployment: this is a single file plus a service restart. smartmontools is
# already present on these machines (the stock SMART template is collecting
# from them), so no software push is required - GPO file copy, RMM script,
# or Ansible win_copy all work.
# ---------------------------------------------------------------------------
