# /etc/zabbix/zabbix_agent2.d/smart_ext.conf     (agent 1: zabbix_agentd.d/)
# NVMe Extended SMART - two UserParameters, nothing else.
#
# Install:
#   1. drop this file in the agent include directory
#   2. install the sudoers rule below
#   3. systemctl restart zabbix-agent2
#
# Verify before restarting Zabbix:
#   sudo -u zabbix /usr/sbin/smartctl --scan -j
#   sudo -u zabbix /usr/sbin/smartctl -j -a -d nvme /dev/nvme0

UserParameter=smart.ext.scan,/usr/bin/sudo /usr/sbin/smartctl --scan -j
UserParameter=smart.ext.raw[*],/usr/bin/sudo /usr/sbin/smartctl -j -a -d $2 $1

# ---------------------------------------------------------------------------
# /etc/sudoers.d/zabbix-smart       chmod 0440, owner root:root
# Validate with: visudo -cf /etc/sudoers.d/zabbix-smart
#
#   zabbix ALL=(root) NOPASSWD: /usr/sbin/smartctl
#
# smartctl path differs by distro - Debian/Ubuntu /usr/sbin/smartctl,
# RHEL family /usr/sbin/smartctl, check with `command -v smartctl`.
# ---------------------------------------------------------------------------
